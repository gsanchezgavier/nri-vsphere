name: Agent Control e2e

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released nri-vsphere version to package (e.g. 1.8.6). Defaults to the latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Mirrors the repackaging that the release pipeline does: keep only the listed files, flat at the package root.
  # The version is resolved once so both platforms test the same release.
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve the nri-vsphere version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$REQUESTED_VERSION" ]; then
            REQUESTED_VERSION=$(gh release view --repo newrelic/nri-vsphere --json tagName --jq .tagName)
          fi
          echo "version=${REQUESTED_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download, filter and repackage the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VSPHERE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/linux/extracted" "$work/linux/dist" "$work/windows/extracted" "$work/windows/dist" packages

          linux_asset="nri-vsphere_linux_${VSPHERE_VERSION}_amd64.tar.gz"
          linux_keep_files=(
            var/db/newrelic-infra/newrelic-integrations/bin/nri-vsphere
            etc/newrelic-infra/integrations.d/vsphere-performance.metrics
          )
          windows_asset="nri-vsphere-amd64.${VSPHERE_VERSION}.zip"
          windows_keep_files=(
            "New Relic/newrelic-infra/newrelic-integrations/bin/nri-vsphere.exe"
            "New Relic/newrelic-infra/integrations.d/vsphere-performance.metrics"
          )

          gh release download "v${VSPHERE_VERSION}" --repo newrelic/nri-vsphere --dir "$work" \
            --pattern "$linux_asset" --pattern "$windows_asset"
          tar xf "$work/$linux_asset" -C "$work/linux/extracted"
          unzip -q "$work/$windows_asset" -d "$work/windows/extracted"

          keep() {
            local platform=$1 asset=$2
            shift 2
            for keep_file in "$@"; do
              if [ ! -f "$work/$platform/extracted/$keep_file" ]; then
                echo "keep_files entry '$keep_file' not found after extracting $asset" >&2
                exit 1
              fi
              cp "$work/$platform/extracted/$keep_file" "$work/$platform/dist/"
            done
          }
          keep linux "$linux_asset" "${linux_keep_files[@]}"
          keep windows "$windows_asset" "${windows_keep_files[@]}"

          tar czf packages/nri-vsphere.tar.gz -C "$work/linux/dist" .
          (cd "$work/windows/dist" && zip -q "$GITHUB_WORKSPACE/packages/nri-vsphere.zip" ./*)
          tar tzf packages/nri-vsphere.tar.gz
          unzip -l packages/nri-vsphere.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nri-vsphere-packages
          path: packages/
          if-no-files-found: error

  agent-control-e2e:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nri-vsphere-packages
          path: packages

      - name: Start the fake vCenter
        run: docker run -d --name vcsim -p 8989:8989 vmware/vcsim:latest

      - name: Test the agent type with Agent Control
        uses: newrelic/newrelic-agent-control/.github/actions/test-ohi-agent@gsanchez/feat/e2e-action
        with:
          agent-type-file: .fleetControl/agentControl/linux.yml
          package-file: packages/nri-vsphere.tar.gz
          config-file: .fleetControl/agentControl/e2e-config.yml
          nrql-assertion: "SELECT * FROM VSphereHostSample WHERE `test.id` = '{{test_id}}' LIMIT 1"
          nr-license-key: ${{ secrets.E2E_LICENSE_KEY }}
          nr-api-key: ${{ secrets.E2E_API_KEY }}
          nr-account-id: ${{ secrets.E2E_ACCOUNT_ID }}
          nr-region: ${{ vars.NR_REGION || 'us' }}

  agent-control-e2e-windows:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nri-vsphere-packages
          path: packages

      # Linux containers are not available on Windows runners, so the simulator runs natively.
      - name: Start the fake vCenter
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo vmware/govmomi --pattern vcsim_Windows_x86_64.zip --dir $env:RUNNER_TEMP
          Expand-Archive -Path "$env:RUNNER_TEMP/vcsim_Windows_x86_64.zip" -DestinationPath "$env:RUNNER_TEMP/vcsim"
          Start-Process -FilePath "$env:RUNNER_TEMP/vcsim/vcsim.exe" -ArgumentList '-l','127.0.0.1:8989'

      - name: Test the agent type with Agent Control
        uses: newrelic/newrelic-agent-control/.github/actions/test-ohi-agent@gsanchez/feat/e2e-action
        with:
          agent-type-file: .fleetControl/agentControl/windows.yml
          package-file: packages/nri-vsphere.zip
          config-file: .fleetControl/agentControl/e2e-config.yml
          nrql-assertion: "SELECT * FROM VSphereHostSample WHERE `test.id` = '{{test_id}}' LIMIT 1"
          nr-license-key: ${{ secrets.E2E_LICENSE_KEY }}
          nr-api-key: ${{ secrets.E2E_API_KEY }}
          nr-account-id: ${{ secrets.E2E_ACCOUNT_ID }}
          nr-region: ${{ vars.NR_REGION || 'us' }}
